name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: test "$(go list -m)" = github.com/SWPSCO/nockchain-go
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./scripts/build-wasm.sh
      - run: node web/test.mjs
      - name: Package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tar -czf "dist/nockchain-go-${RELEASE_TAG}-wasm.tar.gz" -C dist/wasm .
          cd dist
          sha256sum "nockchain-go-${RELEASE_TAG}-wasm.tar.gz" > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/nockchain-go-${RELEASE_TAG}-wasm.tar.gz" dist/SHA256SUMS \
            --verify-tag --generate-notes --draft --title "nockchain-go ${RELEASE_TAG}"
          gh release edit "$RELEASE_TAG" --draft=false --latest
