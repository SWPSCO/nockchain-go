name: Go
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.23.x', 'stable']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -run '^$' -fuzz FuzzParseExtendedKey -fuzztime 5s -parallel 2
      - run: go test -run '^$' -fuzz FuzzParseDigest -fuzztime 5s -parallel 2
      - run: go test -run '^$' -fuzz FuzzCue -fuzztime 5s -parallel 2
      - run: go test -run '^$' -fuzz FuzzParseTransactionV1 -fuzztime 5s -parallel 2
      - run: go test ./internal/wasmapi -run '^$' -fuzz FuzzCall -fuzztime 5s -parallel 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: ./scripts/build-wasm.sh
      - run: node web/test.mjs
